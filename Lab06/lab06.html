<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab6 | SVG</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Lab 6: Creating SVG files</h1>
    <!---------------------------PART1--------------------------->
    <div id="part1">
        <h3>Part 1:</h3>
        <svg width="600" height="200">
            <!--------------------------- Traingle --------------------------->
            <polygon points="50,150 150,150 100,50" fill="yellow" stroke="black" stroke-width="2"/>
            <text x="70" y="170">Triangle</text>

            <!--------------------------- Quadrilateral --------------------------->
            <rect x="180" y="50" height="100" width="100" fill="#89CFF0" stroke="black" stroke-width="2"/>
            <text x="190" y="170">Quadrilateral</text>

            <!--------------------------- Pentagon --------------------------->
            <polygon points="300,90 330,150, 390,150 420,90 360,50" fill="#FBCEB1" stroke="black" stroke-width="2"/>
            <text x="330" y="170">Pentagon</text>

            <!--------------------------- Hexagon --------------------------->
            <polygon points="450,80 450,130, 500,160 550,130 550,80 500,50" fill="#ACE1AF" stroke="black" stroke-width="2"/>
            <text x="470" y="180">Hexagon</text>

        </svg>
    </div>

    <!---------------------------PART2--------------------------->
    <div id="part2">
        <h3>Part 2:</h3>
        <svg width="400" height="400">
            <circle cx="200" cy="150" r="100" fill="yellow" style="opacity: 1;"></circle>
            <text x="180" y="110" style="font-size: 3rem; font-weight: bold">Y</text>
            <circle cx="150" cy="250" r="100" fill="#FF0090" style="opacity: 0.6;"></circle>
            <text x="90" y="300" style="font-size: 3rem; font-weight: bold">M</text>
            <circle cx="250" cy="250" r="100" fill="#1877F2" style="opacity: 0.6;"></circle>
            <text x="280" y="300" style="font-size: 3rem; font-weight: bold">C</text>
        </svg>
    </div>

    <!---------------------------PART3--------------------------->
    <div id="part3">
        <h3>Part 3:</h3>
        <svg width="200" height="200">
            <rect x="0" y="0" width="200" height="50"/>
            <rect x="0" y="50" width="200" height="50" fill="#3B3C36"/>
            <rect x="0" y="100" width="200" height="50" fill="#808080"/>
            <rect x="0" y="150" width="200" height="50" fill="#B6B6B4"/>
        </svg>
    </div>

    <footer>Maitreyee Das © 2024, CPS530, Toronto Metropolitan University</footer>

</body>
</html>
